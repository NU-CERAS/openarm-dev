[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-sim"
version = "0.1.0"
description = "Cartesian reach, drumming simulation and skill learning"
requires-python = ">=3.12"
dependencies = [
    "openarm-tools>=0.1.0",
    "mujoco==3.17.0",
    "numpy>=2,<3",
    "mink==1.3.0",
    "daqp==0.10.3",
    "pillow>=11,<13",
    "gymnasium==1.4.0",
    "jsonschema>=4,<5",
    "scipy>=1.14",
    "pyyaml>=6,<7",
    "psutil>=6,<8",
    "ompl==2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
rl = ["stable-baselines3==2.9.0"]
gpu-sim = ["mujoco-warp==3.17.0"]
tracking = ["wandb==0.31.0"]
imitation = ["h5py==3.16.0", "torchvision==0.29.1"]
agent = ["openai==2.54.0"]
planning = ["nvidia-curobo[cu13-torch] @ git+https://github.com/NVlabs/curobo.git@78fd485fa82d9b9a063fb4985e371814587e666a"]
video = ["imageio>=2.37,<3", "imageio-ffmpeg==0.6.0"]
assets = ["trimesh==5.2.0"]

[project.scripts]
openarm-reach = "openarm_sim.demo:main"
openarm-train-drum = "openarm_sim.training.train:main"
openarm-train-pickup-gpu = "openarm_sim.training.warp_train:main"
openarm-track-training = "openarm_sim.training.wandb_tracking:main"
openarm-collect-act = "openarm_sim.act_data:main"
openarm-train-act = "openarm_sim.training.act_train:main"
openarm-train-act-residual = "openarm_sim.act_residual:main"
openarm-distill-act = "openarm_sim.act_distill:main"
openarm-agent = "openarm_sim.agent:main"
openarm-build-planning-assets = "openarm_sim.planning.assets:main"
openarm-replay = "openarm_sim.replay:main"
openarm-record-demo = "openarm_sim.record_demo:main"
openarm-import-drum = "openarm_sim.drum_asset:main"
openarm-evaluate-pickup = "openarm_sim.training.pickup_evaluation:main"
openarm-train-pickup-residual = "openarm_sim.training.robust_pickup:main"
openarm-train-strike = "openarm_sim.training.strike_train:main"
openarm-train-skills = "openarm_sim.training.skill_pipeline:main"
openarm-compute = "openarm_sim.compute_guard:main"
openarm-sync = "openarm_sim.console.app:main"
openarm-showcase = "openarm_sim.console.showcase:main"
openarm-record-policy = "openarm_sim.console.policy_video:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openarm_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
