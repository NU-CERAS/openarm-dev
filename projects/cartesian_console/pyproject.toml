[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-sim"
version = "0.1.0"
description = "Cartesian preview, motion planning and ROS robot execution"
requires-python = ">=3.12"
dependencies = [
    "openarm-tools>=0.1.0",
    "mujoco==3.17.0",
    "numpy>=1.26,<3",
    "mink==1.3.0",
    "daqp==0.10.3",
    "pillow>=11,<13",
    "gymnasium==1.4.0",
    "jsonschema>=4,<5",
    "scipy>=1.14",
    "pyyaml>=6,<7",
    "psutil>=6,<8",
    "ompl==2.0.1",
    "jsonlines==4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
agent = ["openai==2.54.0"]
planning = ["nvidia-curobo[cu13-torch] @ git+https://github.com/NVlabs/curobo.git@78fd485fa82d9b9a063fb4985e371814587e666a"]
video = ["imageio>=2.37,<3", "imageio-ffmpeg==0.6.0"]
assets = ["trimesh==5.2.0"]

[project.scripts]
openarm-reach = "openarm_sim.demo:main"
openarm-agent = "openarm_sim.agent:main"
openarm-build-planning-assets = "openarm_sim.planning.assets:main"
openarm-replay = "openarm_sim.replay:main"
openarm-import-drum = "openarm_sim.drum_asset:main"
openarm-compute = "openarm_sim.compute_guard:main"
openarm-sync = "openarm_sim.console.launch:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openarm_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
