[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-rl"
version = "0.1.0"
description = "OpenDrummer camera-free strike skills, simulation learning and policy deployment"
requires-python = ">=3.12"
dependencies = [
    "openarm-sim>=0.1.0", "openarm-drummer>=0.1.0",
    "gymnasium==1.4.0", "stable-baselines3==2.9.0", "torch==2.14.1",
    "imageio>=2.37,<3", "imageio-ffmpeg==0.6.0",
    "mido==1.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
gpu-sim = ["mujoco-warp==3.17.0"]
tracking = ["wandb==0.31.0"]
imitation = ["h5py==3.16.0", "torchvision==0.29.1"]

[project.scripts]
openarm-train-drum = "openarm_rl.training.train:main"
openarm-train-pickup-gpu = "openarm_rl.training.warp_train:main"
openarm-track-training = "openarm_rl.tracking.wandb_tracking:main"
openarm-collect-act = "openarm_rl.imitation.data:main"
openarm-train-act = "openarm_rl.training.act_train:main"
openarm-train-act-residual = "openarm_rl.imitation.residual:main"
openarm-distill-act = "openarm_rl.imitation.distill:main"
openarm-evaluate-pickup = "openarm_rl.evaluation.pickup:main"
openarm-train-pickup-residual = "openarm_rl.training.robust_pickup:main"
openarm-train-strike = "openarm_rl.training.strike_train:main"
openarm-train-skills = "openarm_rl.pipelines.skills:main"
openarm-record-policy = "openarm_rl.recording.policy:main"
openarm-policy-replay = "openarm_rl.deployment.replay:main"
openarm-record-demo = "openarm_rl.recording.reference:main"
openarm-showcase = "openarm_rl.recording.showcase:main"
openarm-task-demo = "openarm_rl.demos.tasks:main"
openarm-train-opendrummer = "openarm_rl.training.opendrummer_train:main"
openarm-train-camera-free = "openarm_rl.training.camera_free:main"
openarm-train-drum-skills = "openarm_rl.pipelines.camera_free:main"
openarm-preflight-drum-skills = "openarm_rl.planning.strikes:main"
openarm-drum-tools = "openarm_rl.skills.cli:main"
openarm-drum-demo = "openarm_rl.demos.camera_free:main"
openarm-train-fast-skills = "openarm_rl.pipelines.fast_skills:main"
openarm-train-strike-act = "openarm_rl.imitation.strike:main"
openarm-generate-drum-layout = "openarm_rl.planning.reachable_layout:main"
openarm-calibrate-drum-references = "openarm_rl.planning.fast_references:main"
openarm-play-midi = "openarm_rl.music.perform:main"
openarm-arrange-midi = "openarm_rl.music.arrangement:main"
openarm-midi-repertoire = "openarm_rl.music.repertoire:main"
openarm-arranged-corpus = "openarm_rl.music.arranged_corpus:main"
openarm-plan-kit-strikes = "openarm_rl.planning.kit_strikes:main"
openarm-train-rhythm = "openarm_rl.training.rhythmic:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openarm_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../cartesian_console/src", "../../src"]
