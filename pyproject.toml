[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-tools"
version = "0.1.0"
description = "Shared OpenArm simulation and commissioning commands"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "mujoco>=3.3,<4"]

[project.scripts]
openarm = "openarm_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openarm_tools*"]
